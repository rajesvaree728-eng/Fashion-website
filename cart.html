<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart</title>
</head>
<!-- Improved HTML -->
<main class="cart-page">
  <div class="cart-page__container">
    <a href="shop.html" class="cart-page__back-btn">&larr; Continue Shopping</a>

    <h1 class="cart-page__title">Shopping Bag 🛒</h1>
    
    <div class="cart-layout">
      <!-- Main Items Content Area -->
      <section class="cart-layout__main" aria-labelledby="items-heading">
        <h2 class="visually-hidden" id="items-heading">Selected Cart Items</h2>
        <ul class="cart-items-list" id="cart-items-list">
          <!-- JavaScript will dynamically inject items with thumbnails here -->
          <!-- Sample dynamic injection template shown below for architectural reference: -->
          <!-- 
          <li class="cart-item">
            <img src="img1.jpg" alt="Product Name" class="cart-item__thumb">
            <div class="cart-item__details">
              <h3 class="cart-item__name">Twinning Couple Matching Outfit</h3>
              <p class="cart-item__price">₹2,198</p>
            </div>
            <div class="cart-item__qty-control">
              <span class="cart-item__qty">Qty: 1</span>
            </div>
            <button class="cart-item__remove-btn" aria-label="Remove item">&times;</button>
          </li>
          -->
        </ul>
      </section>

      <!-- Sidebar Summary Panel Panel -->
      <aside class="cart-panel" aria-labelledby="summary-heading">
        <h2 class="cart-panel__title" id="summary-heading">
          Order Summary (<span id="cart-count">0</span>)
        </h2>
        
        <div class="cart-panel__totals">
          <div class="cart-panel__row">
            <span>Subtotal</span>
            <span>₹<span id="cart-total-price">0.00</span></span>
          </div>
          <div class="cart-panel__row">
            <span>Shipping</span>
            <span class="cart-panel__free-tag">FREE</span>
          </div>
          <div class="cart-panel__row cart-panel__row--total">
            <strong>Estimated Total</strong>
            <strong>₹<span id="cart-total-price-final">0.00</span></strong>
          </div>
        </div>

        <div class="cart-panel__actions">
            <a href="thankyou.html">
          <button class="btn btn--primary" id="checkout-btn">Continue to Payment</button></a>
          <button class="btn btn--secondary" id="clear-cart-btn">Clear Cart</button>
        </div>
      </aside>
    </div>
  </div>
</main>
</html>
<style>
    /* Corrected CSS (Modern, Clean & Aesthetic) */

/* Structural Layout Main Wrapper */
.cart-page {
  background-color: var(--clr-bg, #FDFBF7);
  padding: calc(var(--space-xl, 2.5rem) * 1.5) var(--space-lg, 1.5rem);
  min-height: 70vh;
}

.cart-page__container {
  max-width: var(--max-width, 1200px);
  margin: 0 auto;
}
/* Corrected CSS (Modern & Clean) */

.cart-page__back-btn {
  display: inline-flex;
  align-items: center;
  gap: var(--space-xs, 0.5rem);
  color: var(--clr-text-muted, #665F55);
  text-decoration: none;
  font-size: 0.95rem;
  font-weight: 600;
  margin-bottom: var(--space-md, 1rem);
  transition: color var(--transition-fast, 0.2s ease), 
              transform var(--transition-fast, 0.2s ease);
}

.cart-page__back-btn:hover {
  color: var(--clr-accent, #C86D51); /* Highlights seamlessly with your terracotta tint */
  transform: translateX(-4px); /* Sleek micor-interaction animation nudging left */
}

.cart-page__title {
  font-size: clamp(1.75rem, 4vw, 2.5rem);
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: -0.02em;
  margin-bottom: var(--space-xl, 2.5rem);
  color: var(--clr-text, #1A1A1A);
}

/* Master Asymmetric Layout Columns Grid */
.cart-layout {
  display: flex;
  flex-direction: column;
  gap: var(--space-xl, 2.5rem);
}

/* Main Items Container Column */
.cart-layout__main {
  flex-grow: 1;
}

/* Base Shopping List Container Component */
.cart-items-list {
  list-style: none;
  padding: 0;
  margin: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-md, 1rem);
}

/* Individual Dynamic Cart Item Node */
.cart-item {
  display: flex;
  align-items: center;
  gap: var(--space-md, 1rem);
  background-color: var(--clr-bg, #FDFBF7);
  border: 1px solid var(--clr-border, rgba(200, 109, 81, 0.15));
  border-radius: var(--radius-md, 12px);
  padding: var(--space-md, 1rem);
  position: relative;
}

.cart-item__thumb {
  width: 80px;
  height: 80px;
  object-fit: cover;
  border-radius: 8px;
  background-color: var(--clr-surface, #D8C5B2);
}

.cart-item__details {
  display: flex;
  flex-direction: column;
  gap: 4px;
  flex-grow: 1;
}

.cart-item__name {
  font-size: 0.95rem;
  font-weight: 600;
  color: var(--clr-text, #1A1A1A);
  margin: 0;
}

.cart-item__price {
  font-size: 1rem;
  font-weight: 700;
  color: var(--clr-accent, #C86D51);
}

.cart-item__remove-btn {
  position: absolute;
  top: var(--space-sm, 0.75rem);
  right: var(--space-sm, 0.75rem);
  background: none;
  border: none;
  font-size: 1.25rem;
  color: var(--clr-text-muted, #665F55);
  cursor: pointer;
  transition: color 0.2s ease;
}

.cart-item__remove-btn:hover {
  color: var(--clr-accent, #C86D51);
}

/* Sidebar Checkout Summary Card */
.cart-panel {
  background-color: var(--clr-bg, #FDFBF7);
  border: 1px solid var(--clr-border, rgba(200, 109, 81, 0.15));
  border-radius: var(--radius-md, 12px);
  padding: var(--space-lg, 1.5rem);
  box-shadow: 0 4px 24px rgba(26, 26, 26, 0.02);
  height: fit-content;
}

.cart-panel__title {
  font-size: 1.2rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--clr-text, #1A1A1A);
  margin-bottom: var(--space-lg, 1.5rem);
  border-bottom: 1px solid var(--clr-border, rgba(200, 109, 81, 0.15));
  padding-bottom: var(--space-sm, 0.75rem);
}

/* Totals Presentation Rows Block */
.cart-panel__totals {
  display: flex;
  flex-direction: column;
  gap: var(--space-md, 1rem);
  margin-bottom: var(--space-lg, 1.5rem);
}

.cart-panel__row {
  display: flex;
  justify-content: space-between;
  font-size: 0.95rem;
  color: var(--clr-text-muted, #665F55);
}

.cart-panel__free-tag {
  color: #2ecc71; /* Accent green for promotional visual targets */
  font-weight: 600;
}

.cart-panel__row--total {
  border-top: 1px dashed var(--clr-surface, #D8C5B2);
  padding-top: var(--space-md, 1rem);
  font-size: 1.15rem;
  color: var(--clr-text, #1A1A1A);
}

/* Actions Button Stack layout wrapper */
.cart-panel__actions {
  display: flex;
  flex-direction: column;
  gap: var(--space-sm, 0.75rem);
}

/* Multi-use Button Classes Sync Hook */
.btn {
  width: 100%;
  padding: 0.9rem;
  font-size: 0.95rem;
  font-weight: 700;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s ease;
  border: 2px solid transparent;
}

.btn--primary {
  background-color: var(--clr-accent, #C86D51);
  color: #ffffff;
}

.btn--primary:hover {
  background-color: var(--clr-text, #1A1A1A);
  transform: translateY(-2px);
}

.btn--secondary {
  background-color: transparent;
  border-color: var(--clr-border, rgba(200, 109, 81, 0.15));
  color: var(--clr-text-muted, #665F55);
}

.btn--secondary:hover {
  background-color: rgba(200, 109, 81, 0.05);
  color: var(--clr-accent, #C86D51);
}

/* Responsive Structural Upgrade Breaks */
@media (min-width: 992px) {
  .cart-layout {
    display: grid;
    /* 2/3 space given to products list, 1/3 given to checkout panel */
    grid-template-columns: 2fr 1fr;
    align-items: start;
    gap: var(--space-xl, 2.5rem);
  }
}

</style>
<script>
    /* ==========================================================================
   CART RENDER & CALCULATION ENGINE (For cart.html)
   ========================================================================== */

document.addEventListener('DOMContentLoaded', () => {
  renderCart();
});

function renderCart() {
  const cartItemsList = document.getElementById('cart-items-list');
  const cartCount = document.getElementById('cart-count');
  const cartTotalPrice = document.getElementById('cart-total-price');
  const cartTotalPriceFinal = document.getElementById('cart-total-price-final');
  const clearCartBtn = document.getElementById('clear-cart-btn');

  // Guard clause to safely stop if elements don't exist on current sub-page
  if (!cartItemsList) return;

  // 1. Fetch persistent items saved in localStorage
  let cartStorage = JSON.parse(localStorage.getItem('ecommerce_cart')) || [];

  // Clear existing static placeholder list structure completely before rewriting
  cartItemsList.innerHTML = '';

  // 2. Handle absolute empty cart view templates
  if (cartStorage.length === 0) {
    cartItemsList.innerHTML = `
      <li class="cart-item-empty" style="text-align: center; padding: 2rem; color: var(--clr-text-muted); list-style: none;">
        Your shopping bag is completely empty. Let's find some fits! 🛍️
      </li>
    `;
    if (cartCount) cartCount.textContent = '0';
    if (cartTotalPrice) cartTotalPrice.textContent = '0.00';
    if (cartTotalPriceFinal) cartTotalPriceFinal.textContent = '0.00';
    return;
  }

  let calculatedRunningTotal = 0;
  let calculatedTotalItemsCount = 0;

  // 3. Loop through saved items and build layout nodes dynamically
  cartStorage.forEach((item, index) => {
    const itemRow = document.createElement('li');
    itemRow.className = 'cart-item';
    
    // Exact mapping matches data model template keys
    itemRow.innerHTML = `
      <img src="${item.img}" alt="${item.name}" class="cart-item__thumb">
      <div class="cart-item__details">
        <h3 class="cart-item__name">${item.name}</h3>
        <p class="cart-item__price">₹${item.price.toLocaleString('en-IN')}</p>
      </div>
      <div class="cart-item__qty-control" style="font-size: 0.9rem; color: var(--clr-text-muted);">
        <span>Qty: ${item.quantity}</span>
      </div>
      <button class="cart-item__remove-btn" data-index="${index}" aria-label="Delete item">&times;</button>
    `;

    cartItemsList.appendChild(itemRow);

    // Dynamic aggregations math calculation tracking
    calculatedRunningTotal += item.price * item.quantity;
    calculatedTotalItemsCount += item.quantity;
  });

  // 4. Update pricing labels instantly across sidebar panels
  if (cartCount) cartCount.textContent = calculatedTotalItemsCount;
  if (cartTotalPrice) cartTotalPrice.textContent = calculatedRunningTotal.toLocaleString('en-IN') + '.00';
  if (cartTotalPriceFinal) cartTotalPriceFinal.textContent = calculatedRunningTotal.toLocaleString('en-IN') + '.00';

  // 5. Wire up Item Deletion hooks securely
  initDeletionListeners(cartItemsList);
  
  // 6. Wire up global full state clearance triggers
  if (clearCartBtn) {
    // Overwrite listener execution cleanly to avoid multi-bind bugs
    clearCartBtn.onclick = () => {
      localStorage.removeItem('ecommerce_cart');
      renderCart(); // Recursive re-render sync
    };
  }
}

/* ==========================================================================
   INTERACTIVE SEPARATE DELETION LOGIC MODULE
   ========================================================================== */
function initDeletionListeners(parentListContainer) {
  // Clear any pre-existing listener bonds to ensure clean execution paths
  parentListContainer.onclick = (event) => {
    const deleteBtn = event.target.closest('.cart-item__remove-btn');
    if (!deleteBtn) return;

    // Pull targeted array entry pointer index directly from dataset hook
    const targetedIndex = parseInt(deleteBtn.dataset.index, 10);
    
    let cartStorage = JSON.parse(localStorage.getItem('ecommerce_cart')) || [];
    
    // Use standard splice framework array mutation rule to delete specific index item
    cartStorage.splice(targetedIndex, 1);
    
    // Push mutation state back down into permanent data layout core
    localStorage.setItem('ecommerce_cart', JSON.stringify(cartStorage));
    
    // Instantly refresh layout elements visually
    renderCart();
  };
}

</script>
