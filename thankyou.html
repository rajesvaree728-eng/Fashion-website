<!-- Improved HTML -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmed - Larya Fashion</title>
  <style>
    /* Design Tokens */
    :root {
      --clr-bg: #FDFBF7;         
      --clr-surface: #D8C5B2;    
      --clr-accent: #C86D51;     
      --clr-text: #1A1A1A;       
      --clr-text-muted: #665F55; 
      --clr-border: rgba(200, 109, 81, 0.2); 
      --clr-success: #2ecc71;

      --space-xs: 0.5rem;
      --space-sm: 0.75rem;
      --space-md: 1rem;
      --space-lg: 1.5rem;
      --space-xl: 2.5rem;

      --radius-md: 12px;
      --radius-full: 9999px;
      --max-width: 600px;
      --transition-fast: 0.2s ease;
    }

    /* Global Reset Baseline */
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--clr-bg);
      color: var(--clr-text);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header Component */
    .main-header {
      background-color: rgba(253, 251, 247, 0.85); 
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--clr-border);
      padding: var(--space-md) var(--space-lg);
    }

    .main-header__container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1200px;
      margin: 0 auto;
    }

    .main-header__title {
      font-size: 1.25rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: -0.02em;
      color: var(--clr-text);
      text-decoration: none;
    }

    /* Thank You Center Canvas */
    .success-container {
      flex-grow: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-xl) var(--space-lg);
    }

    /* Gen-Z Minimalist Success Card Block */
    .thankyou-card {
      background-color: var(--clr-bg);
      border: 1px solid var(--clr-border);
      border-radius: var(--radius-md);
      padding: calc(var(--space-xl) * 1.5) var(--space-lg);
      max-width: var(--max-width);
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(200, 109, 81, 0.04);
      animation: cardAppear 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    /* Success Checkmark Circle */
    .thankyou-card__icon-wrapper {
      width: 72px;
      height: 72px;
      background-color: rgba(46, 204, 113, 0.1);
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto var(--space-lg);
    }

    .thankyou-card__icon {
      font-size: 2rem;
      color: var(--clr-success);
      animation: scaleIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s both;
    }

    .thankyou-card__title {
      font-size: clamp(1.75rem, 5vw, 2.25rem);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: -0.02em;
      color: var(--clr-text);
      margin-bottom: var(--space-sm);
    }

    .thankyou-card__message {
      font-size: 1.05rem;
      color: var(--clr-text-muted);
      max-width: 42ch;
      margin: 0 auto var(--space-lg);
    }

    /* Order Details Tracker Badge */
    .order-meta {
      background-color: rgba(216, 197, 178, 0.15);
      border-radius: 8px;
      padding: var(--space-md);
      margin-bottom: var(--space-xl);
      display: inline-flex;
      flex-direction: column;
      gap: 4px;
    }

    .order-meta__id {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--clr-text);
    }

    .order-meta__note {
      font-size: 0.8rem;
      color: var(--clr-text-muted);
    }

    /* Action Trigger Layout Buttons */
    .thankyou-card__actions {
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
      max-width: 280px;
      margin: 0 auto;
    }

    .btn {
      width: 100%;
      padding: 0.85rem;
      font-size: 0.95rem;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      transition: all var(--transition-fast);
      border: 2px solid transparent;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn--primary {
      background-color: var(--clr-accent);
      color: #ffffff;
    }

    .btn--primary:hover {
      background-color: var(--clr-text);
      transform: translateY(-2px);
    }

    /* Micro-interaction Keyframes */
    @keyframes cardAppear {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes scaleIn {
      from { transform: scale(0); }
      to { transform: scale(1); }
    }
  </style>
</head>
<body>

  <header class="main-header">
    <div class="main-header__container">
      <a href="index.html" class="main-header__title">Larya Fashion</a>
    </div>
  </header>

  <main class="success-container">
    <article class="thankyou-card">
      <div class="thankyou-card__icon-wrapper">
        <span class="thankyou-card__icon">✓</span>
      </div>
      
      <h1 class="thankyou-card__title">Order Placed</h1>
      <p class="thankyou-card__message">
        Thank you for your purchase! Your payment was processed successfully and your items are preparing for shipment.
      </p>

      <div class="order-meta">
        <span class="order-meta__id" id="order-number">Order ID: #LF-83921</span>
        <span class="order-meta__note">A confirmation email has been dispatched.</span>
      </div>

      <div class="thankyou-card__actions">
        <a href="shop.html" class="btn btn--primary">Continue Shopping</a>
      </div>
    </article>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // 1. GENERATE DYNAMIC ORDER NUMBER FOR PREMIUM FEEL
      const orderNumberSpan = document.getElementById("order-number");
      if (orderNumberSpan) {
        const randomID = Math.floor(10000 + Math.random() * 90000);
        orderNumberSpan.textContent = `Order ID: #LF-${randomID}`;
      }

      // 2. CRITICAL STEP: Clear checkout data automatically so cart state is reset
      localStorage.removeItem("ecommerce_cart");
    });
  </script>
</body>
</html>
